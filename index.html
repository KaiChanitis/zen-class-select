<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9/6 學員長講習出席調查表</title>
    <style>
        :root {
            --ios-bg: #f2f2f7;
            --card-bg: rgba(255, 255, 255, 0.75);
            --card-border: rgba(255, 255, 255, 0.4);
            --primary-blue: #007aff;
            --text-main: #1c1c1e;
            --text-sub: #8e8e93;
            --success-color: #34c759;
            --warning-color: #ff9500;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--ios-bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 122, 255, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(52, 199, 89, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            padding: 20px 16px 40px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
        }

        /* Header Layout */
        .header-card { text-align: center; }
        .header-line1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 6px; color: var(--text-main); }
        .header-line2 { font-size: 1rem; font-weight: 600; margin-bottom: 6px; color: var(--text-main); }
        .header-line3 { font-size: 0.95rem; font-weight: 600; color: var(--primary-blue); }

        /* Form Controls */
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 8px; }
        
        .select-input, .input-text {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid rgba(0,0,0,0.1);
            background: rgba(255, 255, 255, 0.9);
            font-size: 1rem;
            outline: none;
            color: var(--text-main);
            appearance: none;
            -webkit-appearance: none;
        }

        /* Status Buttons */
        .status-options { display: flex; gap: 10px; }
        .status-btn {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(0, 0, 0, 0.08);
            background: rgba(255, 255, 255, 0.6);
            color: var(--text-main);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }
        .status-btn.selected-attend {
            background: var(--success-color);
            color: white;
            border-color: var(--success-color);
            box-shadow: 0 4px 12px rgba(52, 199, 89, 0.3);
        }
        .status-btn.selected-leave {
            background: var(--warning-color);
            color: white;
            border-color: var(--warning-color);
            box-shadow: 0 4px 12px rgba(255, 149, 0, 0.3);
        }

        /* Submit Button */
        .submit-btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: var(--primary-blue);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(0, 122, 255, 0.3);
            transition: all 0.2s;
        }
        .submit-btn:disabled { background: #b0b0b7; box-shadow: none; cursor: not-allowed; }

        /* Stats & Records */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .stat-box { background: rgba(255, 255, 255, 0.5); padding: 12px; border-radius: 10px; text-align: center; border: 1px solid rgba(255,255,255,0.3); }
        .stat-number { font-size: 1.6rem; font-weight: 700; }
        .stat-attend { color: var(--success-color); }
        .stat-leave { color: var(--warning-color); }
        
        .record-list { list-style: none; margin-top: 10px; max-height: 250px; overflow-y: auto; padding-right: 4px; }
        .record-item { padding: 12px 0; border-bottom: 1px solid rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; font-size: 0.95rem; }
        .record-item:last-child { border-bottom: none; }
        .badge { padding: 5px 10px; border-radius: 8px; font-size: 0.8rem; font-weight: 600; color: white; min-width: 65px; text-align: center; }
        .badge-attend { background: var(--success-color); }
        .badge-leave { background: var(--warning-color); }
        .note-text { display: block; color: var(--text-sub); font-size: 0.85rem; margin-top: 2px; }
        .loading-text { text-align: center; color: var(--text-sub); font-size: 0.9rem; padding: 20px 0; font-style: italic; }

        /* 滾動條樣式 */
        .record-list::-webkit-scrollbar { width: 5px; }
        .record-list::-webkit-scrollbar-track { background: rgba(0,0,0,0.05); border-radius: 5px; }
        .record-list::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 5px; }
    </style>
</head>
<body>

<div class="container">
    <!-- Header Section -->
    <div class="glass-card header-card">
        <div class="header-line1">9/6 學員長講習出席調查表</div>
        <div class="header-line2">新一期夜間高級班學員長/副學員長</div>
        <div class="header-line3">時間: 下午1:30-6:00</div>
    </div>

    <!-- Form Section -->
    <div class="glass-card">
        <form id="attendanceForm">
            <div class="form-group">
                <label class="form-label" for="userNameSelect">選擇學員長姓名</label>
                <select id="userNameSelect" class="select-input" required>
                    <option value="" disabled selected>請選擇您的姓名...</option>
                    <option value="詹凱涵_傳涵">詹凱涵_傳涵</option>
                    <option value="林傑儒_法雍">林傑儒_法雍</option>
                    <option value="劉哲志_傳登">劉哲志_傳登</option>
                    <option value="劉榮倍_法泉">劉榮倍_法泉</option>
                    <option value="傅重學_法行">傅重學_法行</option>
                    <option value="李文漂">李文漂</option>
                    <option value="張伯文_傳責">張伯文_傳責</option>
                    <option value="詹馨鴻_傳譽">詹馨鴻_傳譽</option>
                    <option value="李錦芳_法鍥">李錦芳_法鍥</option>
                    <option value="張秝屏_法恭">張秝屏_法恭</option>
                    <option value="王韻聆_法冰">王韻聆_法冰</option>
                    <option value="吳雅雯_法解">吳雅雯_法解</option>
                    <option value="楊秀芍_傳芍">楊秀芍_傳芍</option>
                    <option value="黃郁茹_傳修">黃郁茹_傳修</option>
                    <option value="陳碧雲_法星">陳碧雲_法星</option>
                    <option value="王俐雯_傳願">王俐雯_傳願</option>
                    <option value="羅俐娟_傳仰">羅俐娟_傳仰</option>
                    <option value="李清花_法曼">李清花_法曼</option>
                    <option value="梁惠華_法中">梁惠華_法中</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">出席狀態</label>
                <div class="status-options">
                    <div class="status-btn" onclick="selectStatus('參加', this)">參加</div>
                    <div class="status-btn" onclick="selectStatus('需請假/會補課', this)">需請假/會補課</div>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="userNote">備註 (選填)</label>
                <input type="text" id="userNote" class="input-text" placeholder="若需請假請註明原因">
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">提交回應</button>
        </form>
    </div>

    <!-- Stats Card -->
    <div class="glass-card">
        <div style="font-weight: 600; font-size: 0.95rem; color: var(--text-main);">即時統計人數</div>
        <div class="stats-grid">
            <div class="stat-box">
                <div style="font-size: 0.85rem; color: var(--text-sub); margin-bottom:4px;">參加</div>
                <div class="stat-number stat-attend" id="attendCount">0</div>
            </div>
            <div class="stat-box">
                <div style="font-size: 0.85rem; color: var(--text-sub); margin-bottom:4px;">請假/補課</div>
                <div class="stat-number stat-leave" id="leaveCount">0</div>
            </div>
        </div>
    </div>

    <!-- Live Records Card -->
    <div class="glass-card">
        <div style="font-weight: 600; font-size: 0.95rem; color: var(--text-main); margin-bottom: 5px;">最新填寫結果</div>
        <ul class="record-list" id="recordList">
            <li class="loading-text">正在從 Google 試算表同步資料...</li>
        </ul>
    </div>
</div>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzsGHLTXOGVD8kA-03Mgem268j0EGIirxxq9U1XTMVK0Nx3HDs2tiZzb_chCsk-MRNNHw/exec";
    let selectedStatusValue = "";

    function selectStatus(val, element) {
        selectedStatusValue = val;
        document.querySelectorAll('.status-btn').forEach(btn => {
            btn.classList.remove('selected-attend', 'selected-leave');
        });

        if (val === '參加') {
            element.classList.add('selected-attend');
        } else {
            element.classList.add('selected-leave');
        }
    }

    function fetchRecords() {
        fetch(GAS_URL, {
            method: "GET",
            redirect: "follow"
        })
        .then(res => res.json())
        .then(data => {
            document.getElementById('attendCount').innerText = data.attendCount || 0;
            document.getElementById('leaveCount').innerText = data.leaveCount || 0;

            const recordList = document.getElementById('recordList');
            recordList.innerHTML = "";

            if (data.records && data.records.length > 0) {
                data.records.slice().reverse().forEach(item => {
                    const li = document.createElement('li');
                    li.className = 'record-item';
                    
                    const badgeClass = item.status === '參加' ? 'badge-attend' : 'badge-leave';
                    const noteHtml = item.note ? `<span class="note-text">${item.note}</span>` : '';

                    li.innerHTML = `
                        <div>
                            <strong>${item.name}</strong>
                            ${noteHtml}
                        </div>
                        <span class="badge ${badgeClass}">${item.status}</span>
                    `;
                    recordList.appendChild(li);
                });
            } else {
                recordList.innerHTML = '<li class="loading-text">目前尚無填寫紀錄</li>';
            }
        })
        .catch(err => {
            console.error("Fetch error:", err);
            document.getElementById('recordList').innerHTML = '<li class="loading-text">讀取紀錄失敗，請重新整理頁面</li>';
        });
    }

    document.getElementById('attendanceForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const nameSelect = document.getElementById('userNameSelect');
        const name = nameSelect.value;
        const note = document.getElementById('userNote').value.trim();

        if (!name) {
            alert('請選擇您的姓名');
            return;
        }

        if (!selectedStatusValue) {
            alert('請選擇出席狀態');
            return;
        }

        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerText = "提交中...";

        const payload = { name: name, status: selectedStatusValue, note: note };

        fetch(GAS_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        }).then(() => {
            alert("提交成功！");
            location.reload();
        }).catch(err => {
            alert("提交失敗，請重試");
            submitBtn.disabled = false;
            submitBtn.innerText = "提交回應";
        });
    });

    window.onload = fetchRecords;
</script>

</body>
</html>
